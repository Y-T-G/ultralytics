# Variant of c3k2-sres-strip (l/x scales) with HGBlock (PP-HGNetV2 / RT-DETR backbone,
# CVPR 2024) replacing C3k2 in backbone and FPN head: n stacked LightConvs with dense
# concat aggregation + squeeze/excitation 1x1s. k=3 LightConv everywhere. Layer 24 stays C3k2 with PSA attn (o2o head mixing).
# Strip gates, sres SPPF/ScaledAdd unchanged. Sweep (interleaved b16 fp16 GPU7,
# 2026-07-24): n=4 LightConv cm=yaml values -> l 859 vs yolo26l 789 (+8.9%, 21.1M),
# x 462 vs yolo26x 440 (+5.0%, 47.3M). Sharp cliff beyond: n5 l 784/x 422, cm*1.25
# l 771/x 412, dense (lightconv=False) catastrophic (l 467). k=5 also failed budget.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 4, HGBlock, [128, 256, 3, True, False]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 4, HGBlock, [256, 512, 3, True, False]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, HGBlock, [256, 512, 3, True, True]]
  - [-1, 1, StripAttn, []] # 7 - strip gate at P4
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 4, HGBlock, [512, 1024, 3, True, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 10
  - [-1, 2, C2PSA, [1024]] # 11
  - [-1, 1, StripAttn, []] # 12 - strip gate at P5

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 4, HGBlock, [256, 512, 3, True, False]] # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 4, HGBlock, [128, 256, 3, True, False]] # 18
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 4, HGBlock, [256, 512, 3, True, False]] # 21
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24
  - [[-1, 12], 1, ScaledAdd, []] # 25: scaled residual from backbone P5
  - [[18, 21, 25], 1, Detect, [nc]]
