# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Variant: strip-moga (StripAttn + MogaGate at backbone P4/P5) on stock C3k2
# bottleneck blocks at baseline widths, s scale. Bench (interleaved b16 fp16 GPU7,
# 2026-07-24): 1979 img/s vs rep strip champion 1891 (+4.7%) and rep strip-moga
# 1803 (+9.8%); 10.84M fused. Chases strip-moga's 0.4800 o2o (best) without its
# speed tax; also re-tests the rep-vs-bottleneck premise at s (original "rep faster"
# finding was b32 on older GPU; at b16 on current cards bottleneck C3k2 wins).
# Not a pure block A/B vs strip: backbone e=0.25 baseline widths vs rep e=0.5.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, StripAttn, []] # 7 - strip gate at P4
  - [-1, 1, MogaGate, []] # 8 - moga gate at P4
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 11
  - [-1, 2, C2PSA, [1024]] # 12
  - [-1, 1, StripAttn, []] # 13 - strip gate at P5
  - [-1, 1, MogaGate, []] # 14 - moga gate at P5

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 20

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 23

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]] # 26
  - [[-1, 14], 1, ScaledAdd, []] # 27: scaled residual from backbone P5

  - [[20, 23, 27], 1, Detect, [nc]]
