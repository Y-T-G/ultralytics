# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Variant: sres + strip with PP-HGNet(V2) aggregation blocks (`C3k2HG`) in place of C3k2's
# Bottleneck. HGNet's finding is that latency does not track FLOPs: a Bottleneck is a narrow-deep
# serial `3x3 -> 3x3 -> add` with low arithmetic intensity, while HGNet keeps every intermediate,
# concatenates once and squeezes with a 1x1, so depth costs `cm = c * hg_e` channels and the block
# pays one aggregation instead of a residual add per conv.
# Inner shape per block: hg_n=2 convs at hg_e=0.5, picked by sweep (larger hg_n or hg_e always lost
# speed). Layer 24 keeps C3k2 because of its PSA attention arg.
#
# Bench, b16/b32 fp16 fused, RTX PRO 6000, interleaved median-of-3, vs same-scale yolo26 baseline:
#   scale  variant     b16            b32            params    GFLOPs
#   s      yolo26s     2176           2341            9.50M     20.7
#   s      c3k2-strip  2075 (-4.7%)   2253 (-3.8%)   10.16M     20.7
#   s      rep-strip   1889 (-13.2%)  1876 (-19.9%)  11.05M     28.4   <- current s champion
#   s      THIS        2159 (-0.8%)   2274 (-2.9%)    9.89M     20.1
#   m      yolo26m      993           1026           20.41M     68.2
#   m      c3k2-strip   968 (-2.5%)   1000 (-2.6%)   21.47M     68.2   <- current m pick
#   m      THIS        1031 (+3.8%)   1041 (+1.5%)   20.79M     65.3
# So HG is +14.3% over the s champion at 10% fewer params, and +6.5% over the m pick.
# Rejected in the same sweep: hg_e 0.75/1.0, hg_n 3/4 (all slower than baseline at both scales),
# and a wide-shallow rep control (bb_e .375/neck_e .75: -20.6% at m, dense rep cost is quadratic).
# mAP is untested: the s champion spends 28.4 GFLOPs, this spends 20.1, so treat a small loss as
# expected and compare against the speed it buys back.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2HG, [256, False, 0.25, 2, 0.5]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2HG, [512, False, 0.25, 2, 0.5]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2HG, [512, True, 0.5, 2, 0.5]]
  - [-1, 1, StripAttn, []] # 7 - strip gate at P4
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2HG, [1024, True, 0.5, 2, 0.5]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 10
  - [-1, 2, C2PSA, [1024]] # 11
  - [-1, 1, StripAttn, []] # 12 - strip gate at P5

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2HG, [512, True, 0.5, 2, 0.5]] # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2HG, [256, True, 0.5, 2, 0.5]] # 18
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 2, C3k2HG, [512, True, 0.5, 2, 0.5]] # 21
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24
  - [[-1, 12], 1, ScaledAdd, []] # 25: scaled residual from backbone P5
  - [[18, 21, 25], 1, Detect, [nc]]
