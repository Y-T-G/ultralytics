# YOLO27 object detection model with P3/8 - P5/32 outputs.
# Same trunk (layers 0-22) as yolo27s-detr-efficient.yaml, e2e Detect head instead of the decoder.
# Evidence stack after 40 runs. Capacity was the single biggest win (wide +0.65 over base), so scale the
# head further and combine it with the refinement family: 2-step FDR + quality + target floor + dilated cls.
# Base: DetectFDRQ. FDR refinement + DGQP quality logit computed from the REFINED
# distribution (D-FINE + GFLv2 combo).

# w2 + shared towers: o2m supervision reaches the deployed branch directly.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
o2o_share_towers: True
head_c2: 192
fixed_c3: 384
fdr_steps: 2
target_floor: 0.05
head_dilated: True

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]

# Per-scale variables resolved into module args as string tokens (see parse_model in tasks.py).

# YOLO26 CSP backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26 FPN/PAN + RTDETRDecoderEfficient
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, DetectFDRQ, [nc]] # 23
